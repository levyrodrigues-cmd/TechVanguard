<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVanguard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">TechVanguard</div>
        <nav class="menu">
            <a href="contato.html">Contato</a>
            <a href="planos.html">Planos</a>
            <a href="sobre.html">Sobre Nós</a>
        </nav>
    </header>
    <main class="container">
        <h1 class="titulo-secao">Cadastro Para Entrar em Contato</h1>
        <p class="subtitulo">Preencha seus dados para realizar a sua reclamação para a TechVanguard</p>

        <div class="area-inscricao">
            
            <form action="/processar-cadastro" method="post" class="coluna-form">
                
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required minlength="3" maxlength="100">
                
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" required minlength="8" maxlength="15">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>

                <label for="data_nasc">Data de Nascimento</label>
                <input type="date" id="data_nasc" name="data_nascimento" min="1900-01-01" max="2026-12-31" required>

                <label for="reclamacao">Sua Reclamação:</label>
                <input type="text" id="reclamacao" name="reclamacao" minlength="10" required>

                <input type="checkbox" name="termos" id="termos" required>
                <label for="termos">Li e Aceito os Termos</label><br><br>

                <button type="submit" class="btn-enviar">Enviar</button>

            </form>

    </main>
</body>
</html>
